<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a5c5a">

    <!-- Redirecionamento (fallback caso o _redirects do Cloudflare Pages não pegue) -->
    <meta http-equiv="refresh" content="0; url=https://all-news-journal-ikgdbajp9nobmquagzvx3v.streamlit.app/">

    <title>All News Journal — Curadoria Premium de Notícias</title>
    <meta name="description" content="Receba as notícias que importam, todas as manhãs. Curadoria premium e gratuita.">

    <!-- Open Graph / WhatsApp / Slack preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://allnewsjournal.uk/">
    <meta property="og:title" content="All News Journal">
    <meta property="og:description" content="Notícias relevantes, sem ruído, todas as manhãs.">
    <meta property="og:image" content="https://raw.githubusercontent.com/gustavojustusnunes-create/noticias-matinais/main/assets/anj-logo.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="All News Journal">
    <meta name="twitter:description" content="Notícias relevantes, sem ruído, todas as manhãs.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/gustavojustusnunes-create/noticias-matinais/main/assets/anj-logo.png">

    <!-- Favicon (logo ANJ) -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/gustavojustusnunes-create/noticias-matinais/main/assets/anj-logo.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fdfbf7;
            font-family: 'Lora', Georgia, serif;
            color: #2c2c2c;
        }
        .wrapper {
            text-align: center;
            padding: 20px;
            max-width: 480px;
        }
        .wrapper img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            box-shadow: 0 6px 18px rgba(10, 92, 90, 0.25);
            margin-bottom: 24px;
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.2rem;
            color: #0a5c5a;
            margin: 0;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .tagline {
            font-style: italic;
            color: #0a5c5a;
            opacity: 0.75;
            margin: 12px 0 28px;
            font-size: 1rem;
        }
        .spinner {
            margin: 0 auto;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(10, 92, 90, 0.15);
            border-top-color: #0a5c5a;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a.manual-link {
            display: inline-block;
            margin-top: 24px;
            color: #0a5c5a;
            text-decoration: underline;
            font-size: 0.88rem;
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .wrapper img { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <img src="https://raw.githubusercontent.com/gustavojustusnunes-create/noticias-matinais/main/assets/anj-logo.png"
         alt="All News Journal" onerror="this.style.display='none'">
    <h1>All News Journal</h1>
    <p class="tagline">Notícias relevantes, sem ruído, todas as manhãs.</p>
    <div class="spinner"></div>
    <noscript>
        <p style="margin-top:24px;">
            <a href="https://all-news-journal-ikgdbajp9nobmquagzvx3v.streamlit.app/">
                Clique aqui para acessar o jornal →
            </a>
        </p>
    </noscript>
    <a class="manual-link" id="manual-link"
       href="https://all-news-journal-ikgdbajp9nobmquagzvx3v.streamlit.app/"
       style="display:none;">
        Não foi redirecionado? Clique aqui →
    </a>
</div>

<script>
(function() {
    var TARGET = "https://all-news-journal-ikgdbajp9nobmquagzvx3v.streamlit.app/";

    // Preserva a query string (ex.: ?acao=cancelar vindo do email)
    var search = window.location.search || '';
    var destino = TARGET + search;

    // Atualiza o link manual com a URL completa
    var manualLink = document.getElementById('manual-link');
    if (manualLink) manualLink.href = destino;

    // Redireciona imediatamente
    window.location.replace(destino);

    // Se o redirect demorar mais de 3 segundos, mostra o link manual
    setTimeout(function() {
        if (manualLink) manualLink.style.display = 'inline-block';
    }, 3000);
})();
</script>

</body>
</html>
