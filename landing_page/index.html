<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All News Journal</title>
    
    <!-- Fonts: Playfair Display (Serif) for mature newspaper look and Lora -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#050505] text-white overflow-x-hidden font-['Inter']">

    <!-- Scroll Track (Creates the height needed for scrolling) -->
    <div class="scroll-track"></div>

    <!-- Sticky Canvas (Holds all the animating elements fixed on screen) -->
    <div class="sticky-container">
        
        <!-- ACT 1: The Newspaper -->
        <div id="newspaper" class="absolute inset-0 flex flex-col items-center justify-center bg-[#f3ece0] text-[#111]">
            <div class="newspaper-header border-b-4 border-double border-gray-900 w-3/4 pb-4 mb-4 text-center">
                <p class="text-sm tracking-[0.2em] uppercase font-bold text-gray-600 mb-2">A Edição Global Diária</p>
                <h1 class="font-['Playfair_Display'] font-black text-6xl md:text-8xl tracking-tight leading-none text-[#0a5c5a]" id="main-title">
                    ALL NEWS JOURNAL
                </h1>
            </div>
            <div class="newspaper-columns flex gap-8 w-3/4 h-64 opacity-60">
                <div class="flex-1 border-r border-gray-400 pr-8">
                    <div class="w-full h-3 bg-gray-400 mb-2"></div>
                    <div class="w-full h-3 bg-gray-400 mb-2"></div>
                    <div class="w-3/4 h-3 bg-gray-400 mb-2"></div>
                    <div class="w-full h-3 bg-gray-400 mb-2 mt-6"></div>
                    <div class="w-full h-3 bg-gray-400 mb-2"></div>
                </div>
                <div class="flex-1 border-r border-gray-400 pr-8">
                    <div class="w-full h-32 bg-gray-500 mb-4"></div>
                    <div class="w-full h-3 bg-gray-400 mb-2"></div>
                    <div class="w-5/6 h-3 bg-gray-400 mb-2"></div>
                </div>
                <div class="flex-1">
                    <div class="w-full h-3 bg-gray-400 mb-2"></div>
                    <div class="w-full h-3 bg-gray-400 mb-2"></div>
                    <div class="w-4/5 h-3 bg-gray-400 mb-2"></div>
                    <div class="w-full h-3 bg-gray-400 mb-2 mt-6"></div>
                    <div class="w-full h-3 bg-gray-400 mb-2"></div>
                </div>
            </div>
            <p class="mt-8 text-sm italic font-['Playfair_Display'] text-gray-500">Role para explorar</p>
        </div>

        <!-- ACT 2: The Globe (Three.js Container) -->
        <div id="globe-wrapper" class="absolute inset-0 opacity-0 pointer-events-none flex items-center justify-center">
            <div id="globe-viz" class="w-full h-full"></div>
        </div>

        <!-- ACT 3: The Content & Subscription Form -->
        <div id="content-overlay" class="absolute inset-0 opacity-0 pointer-events-none flex items-center">
            <div class="container mx-auto px-6 md:px-12 flex justify-end">
                <div class="w-full max-w-lg bg-black/60 backdrop-blur-xl p-10 rounded-2xl border border-white/10 shadow-2xl transform translate-x-12" id="subscribe-box">
                    <h2 class="font-['Playfair_Display'] text-4xl font-bold mb-4 leading-tight">O mundo muda rápido.<br>Nós filtramos o ruído.</h2>
                    <p class="text-gray-300 mb-8 font-light text-lg">Curadoria premium das notícias que importam, entregues diretamente no seu e-mail todas as manhãs. Sem distrações.</p>
                    
                    <form class="flex flex-col gap-4">
                        <input type="email" placeholder="Seu melhor e-mail" class="bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:border-white transition-colors">
                        <button type="button" class="bg-white text-black font-semibold rounded-lg px-4 py-3 hover:bg-gray-200 transition-colors">
                            Receber Edição Gratuita
                        </button>
                    </form>
                    
                    <div class="mt-8 pt-6 border-t border-white/10 text-center">
                        <!-- Redireciona para o streamlit no dominio atual -->
                        <a href="http://localhost:8501" class="text-sm text-gray-400 hover:text-white transition-colors">Já sou leitor -> Acessar a Edição de Hoje</a>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <!-- GSAP for scroll animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Three.js and Globe.gl for the 3D earth -->
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
