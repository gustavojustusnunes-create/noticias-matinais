name: All News Journal — Publicação X (Twitter)

on:
  workflow_run:
    workflows: ["All News Journal — Edição Diária"]
    types:
      - completed
  workflow_dispatch:

jobs:
  publicar-x:
    name: Publicar Pauta Nobre no X
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar publicação no X
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python postar_x_diario.py

      - name: Persistir registros e capas geradas
        run: |
          git config user.name  "ANJ Bot"
          git config user.email "actions@github.com"
          git add edicoes/imagens/ || true
          git add -f logs/ || true
          git diff --staged --quiet || git commit -m "Publicação no X e capa gerada [skip ci]"
          git pull --rebase origin main || true
          git push || true
