name: Video Diario (Email)

on:
  schedule:
    # Roda todos os dias às 10:00 UTC (07:00 BRT, logo após o email diário das 06:00 BRT)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite disparo manual via botão no GitHub

jobs:
  gerar_e_enviar_video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13' # Mesma versão do repo

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-video.txt') }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-video.txt

    - name: Generate and Email Video
      env:
        CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
      run: |
        python enviar_video_diario.py
