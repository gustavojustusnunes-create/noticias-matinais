name: Despertador do Site Premium

on:
  schedule:
    - cron: '*/15 * * * *' 
  workflow_dispatch:

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
    - name: Acordar Servidor (Gerenciando Cookies)
      run: |
        # Usando -c e -b para salvar e enviar cookies. Isso simula uma sessão real de usuário.
        # Ao aceitar o cookie, o Streamlit é obrigado a carregar o contêiner e a página completa.
        curl -c cookies.txt -b cookies.txt -sL --max-time 60 https://all-news-journal-w3utkdwxerflwqytjyc7p2.streamlit.app/ > /dev/null
        echo "Ping executado com sucesso e página renderizada. Servidor acordado!"
