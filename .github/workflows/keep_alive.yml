name: Keep Alive (mantém app quente)

on:
  schedule:
    - cron: '*/10 * * * *'   # A cada 10 minutos
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Streamlit
        env:
          STREAMLIT_URL: ${{ secrets.STREAMLIT_URL }}
        run: |
          set -u

          URL="${STREAMLIT_URL:-https://allnewsjournal.streamlit.app/}"
          HIBERNATE_MARK="Yes, get this app back up"
          UA="Mozilla/5.0 (compatible; AllNewsJournal-KeepAlive/1.0; +https://github.com/${{ github.repository }})"

          echo "🌐 Pingando: $URL"

          for tentativa in 1 2 3; do
            echo ""
            echo "🔁 Tentativa ${tentativa}/3"

            body_file=$(mktemp)
            http_code=$(curl -sSL \
                          -A "$UA" \
                          -o "$body_file" \
                          -w "%{http_code}" \
                          --max-time 60 \
                          "$URL" || echo "000")

            echo "   Status HTTP: $http_code"

            # Detecta página de hibernação do Streamlit Cloud
            if grep -qF "$HIBERNATE_MARK" "$body_file" 2>/dev/null; then
              echo "   💤 App está HIBERNANDO."
              echo "   ℹ️  Wake-up via API não é confiável no Streamlit Cloud."
              echo "      O alerta de keyword do UptimeRobot já avisou por email —"
              echo "      basta abrir a URL no navegador e clicar no botão de wake."
              rm -f "$body_file"
              exit 0   # Não falha o workflow — só registra
            fi

            rm -f "$body_file"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
              echo "   ✅ App quente e respondendo (HTTP $http_code)."
              exit 0
            fi

            if [ "$tentativa" -lt 3 ]; then
              echo "   ⏳ Resposta inesperada. Aguardando 30s..."
              sleep 30
            fi
          done

          echo ""
          echo "❌ App não respondeu após 3 tentativas."
          exit 1
