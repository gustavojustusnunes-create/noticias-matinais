name: Despertador do Site Premium

on:
  schedule:
    # Roda a cada 15 minutos para impedir a hibernação (Streamlit dorme em ~30min)
    - cron: '*/15 * * * *' 
  workflow_dispatch: # Permite rodar o botão manualmente se precisarmos testar

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
    - name: Ping no Site (Full GET)
      run: |
        # Usando -sL: "s" para modo silencioso no log, "L" para seguir possíveis redirecionamentos do Streamlit.
        # O timeout evita que o GitHub Actions trave caso o Streamlit demore a responder.
        curl -sL --max-time 30 https://all-news-journal-w3utkdwxerflwqytjyc7p2.streamlit.app/ > /dev/null
        echo "Ping executado com sucesso e site mantido acordado."
