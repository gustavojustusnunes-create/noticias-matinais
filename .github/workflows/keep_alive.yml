name: Despertador do Site Premium

on:
  schedule:
    # Mantemos a cada 15 minutos para evitar a hibernação padrão do Streamlit
    - cron: '*/15 * * * *' 
  workflow_dispatch:

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
    - name: Ping no Site (Anti-Loop)
      run: |
        # Limitamos os redirecionamentos para 3 e usamos "|| true" para forçar o status de Sucesso na Action
        curl -sL --max-time 15 --max-redirs 3 https://all-news-journal-w3utkdwxerflwqytjyc7p2.streamlit.app/ > /dev/null || true
        echo "Ping executado com sucesso. Máquina acordada."
