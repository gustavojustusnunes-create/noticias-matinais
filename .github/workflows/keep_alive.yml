name: Despertador do Site Premium

on:
  schedule:
    - cron: '*/15 * * * *' 
  workflow_dispatch:

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
    - name: Acordar Servidor (Health Check)
      run: |
        # Batendo direto na rota de diagnóstico do Streamlit para evitar o loop de JavaScript
        curl -s -o /dev/null -w "%{http_code}" https://all-news-journal-w3utkdwxerflwqytjyc7p2.streamlit.app/_stcore/health || true
        echo " - Ping executado na rota de saúde. Servidor mantido online."
