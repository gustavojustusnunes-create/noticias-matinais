name: Keep Alive (curl leve)

on:
  schedule:
    - cron: '0 */6 * * *'   # A cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:          # Permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Streamlit (com retry)
        env:
          STREAMLIT_URL: ${{ secrets.STREAMLIT_URL }}
        run: |
          # Usa o secret; se não existir, usa a URL padrão do projeto
          URL="${STREAMLIT_URL:-https://allnewsjournal.streamlit.app/}"
          echo "🌐 Pingando: $URL"

          for tentativa in 1 2 3; do
            echo "🔁 Tentativa $tentativa de 3..."
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 45 "$URL")
            echo "   Status HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "✅ App respondeu OK (HTTP $HTTP_CODE)"
              exit 0
            fi

            echo "   ⚠️ Resposta inesperada (HTTP $HTTP_CODE). Aguardando 30s..."
            sleep 30
          done

          echo "❌ App não respondeu após 3 tentativas."
          exit 1
