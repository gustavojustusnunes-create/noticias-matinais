name: Keep Alive Streamlit

# Mantém o app Streamlit acordado abrindo-o num navegador REAL (headless).
# Um curl simples NÃO impede a hibernação do Streamlit Community Cloud —
# ele só conta como "ativo" quando há uma sessão de navegador (WebSocket).
# Por isso usamos Playwright para visitar a página de verdade e, se estiver
# hibernando, clicar no botão "Yes, get this app back up".
#
# Requer repositório PÚBLICO (minutos de Actions ilimitados). Em repo privado
# isso consumiria a cota mensal rapidamente.

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 minutos
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright (Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visitar o app (mantém acordado)
        env:
          STREAMLIT_URL: ${{ secrets.STREAMLIT_URL }}
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = (os.environ.get("STREAMLIT_URL") or
                 "https://all-news-journal-ikgdbajp9nobmquagzvx3v.streamlit.app/")
          print("🌐 Visitando:", url)

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  page = browser.new_page()
                  page.goto(url, wait_until="domcontentloaded", timeout=120000)

                  # Se estiver hibernando, clica no botão de reativar.
                  try:
                      botao = page.get_by_text("get this app back up", exact=False)
                      if botao.count() > 0:
                          print("💤 App hibernando — clicando para acordar…")
                          botao.first.click()
                          page.wait_for_timeout(45000)  # espera subir
                  except Exception as e:
                      print("   (sem botão de wake):", e)

                  # Mantém a sessão ativa um tempo para registrar atividade real.
                  page.wait_for_timeout(20000)
                  print("✅ Visitado. Título da página:", page.title())
                  browser.close()
          except Exception as e:
              # best-effort: nunca falha o job (evita email de falha do GitHub).
              print("⚠️ Visita não concluída (sem problema, é best-effort):", e)

          # exit 0 sempre.
          PY
