name: Keep Alive (Lightweight)

on:
  schedule:
    - cron: '*/25 * * * *'   # A cada 25 minutos
  workflow_dispatch:           # Permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Streamlit
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 \
            "https://all-news-journal-w3utkdwxerflwqytjyc7p2.streamlit.app/")
          echo "Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "⚠️ App pode estar com problema (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ App respondeu OK (HTTP $HTTP_CODE)"
