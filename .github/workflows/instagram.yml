name: Instagram Daily Posts

on:
  schedule:
    # Roda uma vez por dia às 12:15 UTC (09:15 BRT) para postar as Top 5 notícias de uma vez.
    - cron: '15 12 * * *'
  workflow_dispatch:         # Permite rodar manualmente

jobs:
  post_instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Só roda quando a Variable INSTAGRAM_ENABLED estiver em "true" (Settings → Variables → Actions).
    # Para pausar posts sem mexer no código, mude a Variable para "false".
    if: ${{ vars.INSTAGRAM_ENABLED == 'true' }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # As fontes da marca (Playfair Display + Lora) são versionadas em fonts/,
      # então não é mais preciso instalar fontes do sistema via apt-get.

      - name: Instalar dependências Instagram
        run: pip install -r requirements-instagram.txt

      - name: Gerar e entregar cards do Instagram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_JSON:          ${{ secrets.GCP_JSON }}
          GOOGLE_SHEETS_ID:  ${{ secrets.GOOGLE_SHEETS_ID }}
          INSTAGRAM_USER:    ${{ secrets.INSTAGRAM_USER }}
          INSTAGRAM_PASS:    ${{ secrets.INSTAGRAM_PASS }}
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
          INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED }}
          # "email" (padrão) envia a mídia p/ postagem manual; "post" publica direto
          INSTAGRAM_DELIVERY: "post"
          INSTAGRAM_EMAIL_TO: ${{ vars.INSTAGRAM_EMAIL_TO }}
          # Resend (usado no modo "email")
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM:       ${{ secrets.RESEND_FROM }}
          PYTHONUTF8: "1"
        run: python instagram_poster.py

      - name: Salvar Memória do Supervisor
        run: |
          git config user.name "ANJ Bot"
          git config user.email "actions@github.com"
          git add -f logs/supervisor_memory.json || true
          git diff --staged --quiet || git commit -m "chore: atualizar memoria do supervisor [skip ci]"
          git pull --rebase origin main || true
          git push || true

      - name: Salvar imagens geradas (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-posts-${{ github.run_id }}
          path: /tmp/instagram_posts/
          if-no-files-found: ignore
          retention-days: 7
