name: All News Journal — Posts Instagram

on:
  schedule:
    - cron: '15 9 * * *'   # 06:15 BRT — 15min depois do envio do email
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar fontes serif para Pillow
        run: sudo apt-get install -y fonts-liberation fonts-dejavu

      - name: Instalar dependências Instagram
        run: pip install -r requirements-instagram.txt

      - name: Executar Instagram Poster
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_USER: ${{ secrets.INSTAGRAM_USER }}
          INSTAGRAM_PASS: ${{ secrets.INSTAGRAM_PASS }}
          INSTAGRAM_ENABLED: ${{ secrets.INSTAGRAM_ENABLED }}
        run: python instagram_poster.py
