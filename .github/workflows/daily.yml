name: Briefing Diário

on:
  schedule:
    - cron: '0 10 * * *' # Roda todo dia as 07:00 Brasil
  workflow_dispatch: # Botão manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código
      uses: actions/checkout@v3

    - name: Instalar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar Dependências (Limpeza Nuclear)
      run: |
        python -m pip install --upgrade pip
        # 1. Removemos qualquer lixo antigo que esteja causando conflito
        pip uninstall -y google-generativeai google-genai generative-ai
        
        # 2. Instalamos a versão BLINDADA (acima da 0.8.0) sem usar cache
        pip install --no-cache-dir "google-generativeai>=0.8.3" gspread feedparser google-auth oauth2client
        
        # 3. Prova Real: Mostra no log qual versão ficou
        echo "🔍 VERSÃO INSTALADA:"
        pip show google-generativeai

    - name: Rodar Robô
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        GCP_JSON: ${{ secrets.GCP_JSON }}
      run: python main.py
