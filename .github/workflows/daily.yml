name: All News Journal (Email Robot)

on:
  schedule:
    - cron: '15 10 * * *' # Roda às 07:15 (Horário de Brasília)
  workflow_dispatch: # Botão manual para testar

jobs:
  run-newsletter:
    runs-on: ubuntu-latest
    # AQUI ESTÁ A SOLUÇÃO: Aumentamos o limite para 60 minutos
    timeout-minutes: 60 

    steps:
    - name: 📥 Baixar código
      uses: actions/checkout@v3

    - name: 🐍 Instalar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip' # Ajuda a instalar mais rápido nas próximas vezes

    - name: ⚙️ Instalar Dependências (Apenas Robô)
      # Removemos 'streamlit' daqui para ficar mais leve
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai requests yfinance gspread feedparser google-auth oauth2client

    - name: 🚀 Rodar Jornal
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        GCP_JSON: ${{ secrets.GCP_JSON }}
      run: python main.py
