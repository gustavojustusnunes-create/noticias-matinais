name: All News Journal (Email Robot)

on:
  schedule:
    - cron: '15 10 * * *' # Roda às 07:15 (Horário de Brasília)
  workflow_dispatch: # Botão manual para testar

jobs:
  run-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: 📥 Baixar código
      uses: actions/checkout@v3

    - name: 🐍 Instalar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: ⚙️ Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Rodar Jornal
      env:
        CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        GCP_JSON: ${{ secrets.GCP_JSON }}
      run: python main.py
