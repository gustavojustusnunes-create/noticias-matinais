name: All News Journal — Edição Diária

on:
  # 06:00 horário de Brasília = 09:00 UTC
  schedule:
    - cron: '0 9 * * *'
  # Botão manual para testar
  workflow_dispatch:

jobs:
  publicar-edicao:
    name: Publicar Edição Diária
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publicar edição diária
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GCP_JSON: ${{ secrets.GCP_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          URL_CANCELAMENTO: ${{ secrets.URL_CANCELAMENTO }}
        run: python main.py

      - name: Notificar falha por email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ All News Journal — Falha na edição (${{ github.run_id }})"
          to: ${{ secrets.EMAIL_USER }}
          from: "All News Journal CI <${{ secrets.EMAIL_USER }}>"
          body: |
            A execução automática da edição diária falhou.

            Repositório: ${{ github.repository }}
            Run ID: ${{ github.run_id }}

            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
