name: Briefing Diário

on:
  schedule:
    - cron: '0 10 * * *' # Roda todo dia as 07:00 Brasil
  workflow_dispatch: # Botão manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código
      uses: actions/checkout@v3

    - name: Instalar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar Dependências (Correção de Versão)
      run: |
        python -m pip install --upgrade pip
        # O SEGRED0: --no-cache-dir (baixa do zero) e >=0.8.0 (exige versão 2024/2025)
        pip install --no-cache-dir "google-generativeai>=0.8.0" gspread feedparser google-auth oauth2client
        
        # Prova real no log
        echo "🔍 Verificando versão instalada:"
        pip show google-generativeai

    - name: Rodar Robô
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        GCP_JSON: ${{ secrets.GCP_JSON }}
      run: python main.py
