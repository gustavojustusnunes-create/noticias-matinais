name: All News Journal — Edição Diária

on:
  # 08:40 UTC = 05:40 BRT. Agendado mais cedo e FORA da hora cheia (minuto 40)
  # porque o cron do GitHub Actions atrasa bastante no minuto 0 (horário mais
  # congestionado). Assim a edição tende a chegar de manhã, mais cedo.
  # Obs.: o GitHub não garante horário exato em agendamentos gratuitos.
  schedule:
    - cron: '40 8 * * *'
  # Botão manual para testar
  workflow_dispatch:

jobs:
  publicar-edicao:
    name: Publicar Edição Diária
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências (OS)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependências (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publicar edição diária
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GCP_JSON: ${{ secrets.GCP_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          URL_CANCELAMENTO: ${{ secrets.URL_CANCELAMENTO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: python main.py

      - name: Publicar edição no repositório
        run: |
          # Se o site_publisher não gerou nada, não falha o job
          [ -d edicoes ] || { echo "ℹ️ Sem pasta edicoes/ — nada a commitar."; exit 0; }
          git config user.name  "ANJ Bot"
          git config user.email "actions@github.com"
          git add edicoes/
          git diff --staged --quiet || git commit -m "Edição $(date +%F)"
          git push

      - name: Notificar falha por email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ All News Journal — Falha na edição (${{ github.run_id }})"
          to: ${{ secrets.EMAIL_USER }}
          from: "All News Journal CI <${{ secrets.EMAIL_USER }}>"
          body: |
            A execução automática da edição diária falhou.

            Repositório: ${{ github.repository }}
            Run ID: ${{ github.run_id }}

            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify failure (Resend)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM:    ${{ secrets.RESEND_FROM }}
          REPO:           ${{ github.repository }}
          RUN_ID:         ${{ github.run_id }}
        run: |
          set -u

          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "ℹ️  RESEND_API_KEY não configurado — pulando notificação via Resend."
            exit 0
          fi

          FROM="${RESEND_FROM:-All News Journal CI <onboarding@resend.dev>}"
          TO="allnewsjournal@gmail.com"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          SUBJECT="⚠️ All News Journal — Falha na edição (${RUN_ID})"

          HTML="<p>A execução automática da edição diária <b>falhou</b>.</p>\
          <ul>\
          <li><b>Repositório:</b> ${REPO}</li>\
          <li><b>Run ID:</b> ${RUN_ID}</li>\
          <li><b>Logs:</b> <a href=\"${RUN_URL}\">${RUN_URL}</a></li>\
          </ul>"

          TEXT="A execução automática da edição diária falhou.\n\nRepositório: ${REPO}\nRun ID: ${RUN_ID}\nLogs: ${RUN_URL}"

          # Monta payload com jq para escape seguro de aspas/quebras
          PAYLOAD=$(jq -n \
            --arg from    "$FROM" \
            --arg to      "$TO" \
            --arg subject "$SUBJECT" \
            --arg html    "$HTML" \
            --arg text    "$TEXT" \
            '{from: $from, to: [$to], subject: $subject, html: $html, text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/resend_resp.json -w "%{http_code}" \
            -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")

          echo "📨 Resend HTTP $HTTP_CODE"
          cat /tmp/resend_resp.json || true
          echo ""

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Notificação de falha enviada via Resend."
          else
            echo "❌ Resend não aceitou a notificação (HTTP $HTTP_CODE)."
            exit 1
          fi
